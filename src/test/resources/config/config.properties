# Default settings. Any key can be overridden with -Dkey=value on the mvn command line.
base.url=https://the-internet.herokuapp.com
browser=chrome
headless=false
explicit.wait.seconds=10
page.load.timeout.seconds=30
# Video of each scenario, built from a screenshot after every step (1 step = 1 second).
#   on-failure : keep the video only when the scenario fails (default)
#   always     : keep a video for every scenario
#   off        : no screenshots between steps
video.mode=on-failure
