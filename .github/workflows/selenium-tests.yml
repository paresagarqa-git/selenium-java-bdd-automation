name: Selenium BDD Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression, e.g. @smoke, or @demo to see a failure with screenshot and video'
        required: false
        default: 'not @wip and not @demo'
      threads:
        description: 'Parallel threads per browser'
        required: false
        default: '4'

jobs:
  test:
    name: tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Let every browser finish even if one fails, so you see all results.
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ubuntu-latest already ships Chrome, Firefox and Edge.
      # WebDriverManager downloads the matching driver (chromedriver / geckodriver / msedgedriver).
      - name: Show browser versions
        run: |
          google-chrome --version
          firefox --version
          microsoft-edge --version

      - name: Run tests (headless ${{ matrix.browser }})
        env:
          TAGS: ${{ github.event.inputs.tags || 'not @wip and not @demo' }}
          THREADS: ${{ github.event.inputs.threads || '4' }}
          # Lets WebDriverManager call the GitHub API (geckodriver releases) without hitting rate limits.
          WDM_GITHUBTOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B test -Dbrowser=${{ matrix.browser }} -Dheadless=true -Dthreads="$THREADS" -Dcucumber.filter.tags="$TAGS"

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: target/cucumber-reports/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-videos-${{ matrix.browser }}
          path: target/videos/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload TestNG / Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports/
          retention-days: 14
