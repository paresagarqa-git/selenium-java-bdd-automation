name: Selenium BDD Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tag expression, e.g. @smoke or "@login and not @wip"'
        required: false
        default: 'not @wip'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ubuntu-latest already ships Google Chrome; WebDriverManager downloads the matching ChromeDriver.
      - name: Show Chrome version
        run: google-chrome --version

      - name: Run tests (headless Chrome)
        env:
          TAGS: ${{ github.event.inputs.tags || 'not @wip' }}
        run: mvn -B test -Dheadless=true -Dcucumber.filter.tags="$TAGS"

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload TestNG / Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
